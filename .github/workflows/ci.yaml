---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Lint action and workflows with actionlint
        run: actionlint

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: Check YAML format
        run: yamllint --config-file .yamllint.yml action.yml .github/workflows/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration - info message
        uses: ./
        with:
          message: Hello from the integration test!

      - name: Integration - warning message
        uses: ./
        with:
          message: This is a warning.
          level: warning

      - name: Integration - error message
        uses: ./
        with:
          message: This is an error.
          level: error
