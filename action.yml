---
name: Log Message
description: Logs a message to the workflow run output.

inputs:
  message:
    description: The message to log.
    required: true
  level:
    description: "Log level: info, warning, or error."
    required: false
    default: info

runs:
  using: composite
  steps:
    - name: Log
      shell: bash
      run: ${{ github.action_path }}/scripts/log.sh "${{ inputs.message }}" "${{ inputs.level }}"
